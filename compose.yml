services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pickview
      POSTGRES_USER: pickview
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-pickview-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pickview-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pickview-local-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media-data:/data"]
volumes:
  postgres-data:
  media-data:
